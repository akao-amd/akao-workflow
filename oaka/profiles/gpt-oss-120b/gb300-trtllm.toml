# gpt-oss-120b on GB300: the user's tuned recipe ("recipe A", 2026-11-26), its fixed part: TensorRT-LLM MHA
# attention, FlashInfer MXFP4 MoE, fp8 KV cache, mem fraction 0.9, no radix cache.  The per-shape part
# (--swa-full-tokens-ratio, --cuda-graph-max-bs-decode) is in its children gb300-trtllm-{small,medium,large};
# serve one of those.
#
# The user's recipe, verbatim:
#   export HF_HUB_CACHE=/shared_nfs/hub
#   # only the 1M group (ISL+OSL > 131072) needs these two:
#   #   export SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1   and   --context-length $((ISL+OSL+256))
#   CUDA_VISIBLE_DEVICES=$GPUS python3 -m sglang.launch_server \
#     --model-path openai/gpt-oss-120b --tp $TP \
#     --attention-backend trtllm_mha --moe-runner-backend flashinfer_mxfp4 \
#     --kv-cache-dtype fp8_e4m3 \
#     --mem-fraction-static 0.9 --disable-radix-cache \
#     --swa-full-tokens-ratio $SWAR --cuda-graph-max-bs-decode $GBS \
#     --port $PORT
# Here: the model is gb300's (the same HF snapshot, from the trays' /model/hub); --host 0.0.0.0 comes with gb300.
# The long-context pair is not in the profile: the plan or suite adds it (meta1124's [env]/[args] do), since it
# depends on the points served (131072/1024 needs it too: 132096 > 131072).
# Image measured with: lmsysorg/sglang:nightly-cu134-20261122-3117f58 (meta1124_t03, 0001_recipe_compare).

description = "gpt-oss-120b, GB300: the user's tuned recipe A (trtllm_mha, flashinfer_mxfp4, fp8 KV, mem 0.9, no radix); serve a -small/-medium/-large child"
extends = "gpt-oss-120b/gb300"

[args]
attention-backend = "trtllm_mha"
moe-runner-backend = "flashinfer_mxfp4"
kv-cache-dtype = "fp8_e4m3"
mem-fraction-static = 0.9
disable-radix-cache = true
