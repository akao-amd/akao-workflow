# gpt-oss-120b on MI355X (gfx950): the user's best recipe, copied as is.  Created 2026-10-30.
# (gpt-oss-120b/best is the gfx1250 W4A8 recipe, hence the -mi355 name.)
#
# Source: given by the user 2026-10-30:
#   SGLANG_AITER_KV_CACHE_LAYOUT=vectorized_5d SGLANG_USE_AITER_MOE_GU_ITLV=False \
#   python3 -m sglang.launch_server --model-path /path/to/gpt-oss-120b/ --tp 1 \
#     --trust-remote-code --mem-fraction-static 0.85 \
#     --prefill-attention-backend aiter --decode-attention-backend aiter \
#     --chunked-prefill-size 131072 --max-running-requests 256 \
#     --page-size 64 --disable-radix-cache --port 8000 --kv-cache-dtype fp8_e4m3
#   --model-path, --tp and --port are oaka's (tp pinned to the recipe's 1 below).
#
# Checkpoint: openai/gpt-oss-120b, the MXFP4 release, as in gpt-oss-120b/mi35x-nightly; `model`
# below is <model_path>/gpt-oss-120b (on n10-17 /data2/openai/gpt-oss-120b: override `model`
# in the plan there).
#
# KNOWN ISSUE (2026-11-01): broken under load on images whose AITER carries CK #10180 (AITER from 10-09; rocm/sgl-dev
# mi35x images from ~10-18 on), and intermittently from CK #9214 (images from ~09-11).  Prefill of gpt-oss's
# head_dim 64 runs CK's hd-128 batch-prefill tile (FmhaBatchPrefillWithPagedKVCacheKernel), whose unchecked
# GLOBAL_LOAD_LDS loads read up to one row past the K/V SGLang hands it (exact size on the vectorized_5d page-1
# extend path): a GPU memory fault, or garbage ("!!!") answers before it.  Reported upstream, unfixed:
# ROCm/aiter#6518, ROCm/rocm-libraries#13600.  Seen: m12-17 10-30 (all 6 servers failed their GSM8K gate), n10-17
# 10-31 (reproduced, root-caused).  Serves again with either fix (n10-17 worker best355_n10, task 0001):
#   - CK range check on the two flat global-load paths of ck_tile::tile_scatter_gather (akao-amd/aiter branch
#     fix-batch-prefill-hdim-pad-overread bumps AITER's CK submodule to it): full TP1/TP2 sweep, 0 faults, GSM8K
#     0.948-0.958;
#   - SGLang handing K and V one zeroed row past their end (the over-read then reads zeros inside SGLang's own
#     allocation): GSM8K 0.949-0.960 TP1, 0.955 TP2, 8k/1k c64 and 70k/300 c16 without a fault.
# Unpatched, dropping SGLANG_AITER_KV_CACHE_LAYOUT=vectorized_5d (NHD) avoided the fault there (GSM8K 0.951), at an
# unmeasured speed cost.
#
# Not yet measured with oaka on a working stack.

description = "gpt-oss-120b MXFP4 (openai), MI355X at TP1: the user's best recipe (aiter attention, fp8 KV in the vectorized 5D layout, page 64)"
arch = ["gfx950"]
model = "/model/gpt-oss-120b"
tp = 1

[env]
SGLANG_AITER_KV_CACHE_LAYOUT = "vectorized_5d"
SGLANG_USE_AITER_MOE_GU_ITLV = "False"

[args]
trust-remote-code = true
mem-fraction-static = 0.85
prefill-attention-backend = "aiter"
decode-attention-backend = "aiter"
chunked-prefill-size = 131072
max-running-requests = 256
page-size = 64
disable-radix-cache = true
kv-cache-dtype = "fp8_e4m3"
