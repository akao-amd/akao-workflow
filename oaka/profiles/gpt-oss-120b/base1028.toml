# gpt-oss-120b (AMD Quark W4A8, amd/gpt-oss-120b-w-mxfp4-a-fp8) on gfx1250: base1028, the recipe distilled
# 2026-10-28 on h13-14 (MI450X MC-Hammer, gfx1250 DPX/NPS2) from B2 ("mix MoE": FlyDSL a8w4 expert GEMMs for
# large batches, the gluon a8w4 kernel over a zero-copy view of FlyDSL's weights for small ones, SGLang's
# breakable prefill CUDA graph).  Written out whole: no extends.  Controller records 100-118 (ww44); the
# evidence for each line is in the worker reports named below (on h13-14 under /2026/ww44/).
#
# ---------------------------------------------------------------------------------------
# The trees: base1028-20261030 branches (akao-amd forks of Triton, AITER and SGLang; public)
#
# One change per commit.  On image rocm/sgl-dev:v0.5.23-rocm101-mi45x-20261030 (SGLang 17e94c4677, AITER 26f4f1fb2
# with uncommitted edits, triton-custom a5af6dd37e = upstream 76940ad348 + "Revert 9debefe", built with LLVM b010a18d,
# which lacks llvm#220357), ROCm 10.1.0:
#
#   Triton base1028-20261030 on a5af6dd37e                            tree 0e8d7c0d3cc7
#     70d183531f  wait for LDS operations before a workgroup barrier     B4 (llvm#220357's fix, for this LLVM);
#                 that covers LDS (explicit s_wait_dscnt 0, lit test)    the image's Triton still has B4
#   AITER  base1028-20261030 on 26f4f1fb2                              tree ba74be7c6356
#     5888805b8  the image's uncommitted aiter edits                   (the image's own, as committed text)
#     03a12e197  2D unified attention: runtime num_seqs / block_table_stride   ROCm/aiter#6999 (merged 10-29)
#     a8a4edaed  3D NHD attention config, AITER_GFX1250_UA3D_NHD_CFG (D3)      not filed
#     93491bc21  gluon a8w4 MoE decode stores its output from registers        B1a, not filed (akao-amd/aiter
#                (the TDM store of an LDS-staged tile read stale LDS)          pr-gfx1250-moe-a8w4-decode-gstore)
#     aa2be0013  gluon unified attention 2D: decode output from registers      B1b, not filed
#     628e82f8e  gluon unified attention 2D: extend output from registers too  B1c, needs the Triton commit above
#     (the FlyDSL a8w4 bias fix, ROCm/aiter#6663, is in 26f4f1fb2 itself)
#   SGLang base1028-20261030 on 17e94c4677                             tree 8fb3a65c66b2
#     2e64cbe15d  the FlyDSL/gluon switch, SGLANG_GFX1250_W4A8_FLYDSL           PR A, sgl-project/sglang#47398
#     3930b1cd1b  the switch keeps FlyDSL's weights in a MemPool of their own    (open)
#     (#44292 and #44455 are in 17e94c4677)
#
# A plan installs them with
#
#   [stack.triton]
#   tree = "<root>/repos/triton/base1028"     # a worktree of /sgl-workspace/triton-custom
#   commit = "70d183531f2de1a24eeb0fd8bb408fd72ee256fc"
#   [stack.aiter]
#   tree = "<root>/repos/aiter/base1028"      # a worktree of /sgl-workspace/aiter
#   commit = "628e82f8e03309749f38b648a8107bdb07e5853a"
#   [stack.sglang]
#   tree = "<root>/repos/sglang/base1028"     # a worktree of /sgl-workspace/sglang
#   commit = "3930b1cd1b2bd5107b78582611a376d5e48486b4"
#
# after `git -C /sgl-workspace/<tree> fetch https://github.com/akao-amd/<repo> base1028-20261030` (stack.sh never
# fetches).  <root> = $AKAO_ARTIFACT_ROOT, never a task dir.  SGLang's install needs cargo (worker skill).  Patches
# against the stock image: e21-13 /2026/ww44/fix_e21/0001_base1028_correctness/patches/ (copied to the console).
#
# Checked on e21-13 (MI45x, gfx1250 DPX/NPS2), 10-31, fix_e21/0001: the switch's unit test passes; no flagged barrier
# in any kernel the servers compiled (B4 scan, 1,050 binaries); graph replay of every gpt-oss attention, MoE decode
# and gemm_a16w16 shape bitwise equal for minutes (the old trees race in extend); 8 fresh servers (4 TP1, 4 TP2),
# fixed-seq 8192/1024 c16 then 1024/1024 c16 then GSM8K strict 1319: 0.9568-0.9636.
#
# Before: base1028-20261028 (AITER a302ebe52, SGLang c00481c654; image -20261027/-20261028's Triton, no B4 fix, no
# B1c), and draft-1030-delivery (image -20261029).  The numbers below were measured on those.
#
# ON ANY OTHER IMAGE the branches are not the image's base: rebase them onto the image's own Triton, AITER and SGLang
# commits.  Drop the image-edits commit and commit that image's own uncommitted aiter edits first, if it has any.
# Drop every commit whose change the image already has (a merged PR: compare, do not trust the PR number alone),
# resolve the rest; keep the Triton commit only while a static scan of the image's Triton still flags B4
# (scan_barrier_dscnt.py in ww44 controller record 168's probes/).  Then check before quoting
# numbers: the switch's unit test (test/registered/amd/test_gpt_oss_w4a8_flydsl_moe_gfx1250.py on PR A's branch,
# run against the installed tree); the server log shows SGLANG_GFX1250_W4A8_FLYDSL in effect and ~68.9 GB of
# weights after load at TP1 (82.4 GB means the MemPool commit is missing); GSM8K after load (fresh server, fixed-seq
# 8192/1024 c16 then 1024/1024 c16, then GSM8K strict 1319, gate 0.93).  When every change is in an image, the
# recipe needs no fork branch at all.
#
# ---------------------------------------------------------------------------------------
# What it is worth, h13-14, TP1 on one partition (sibling idle), fixed-seq run 1, range ratio 0.8
#
# Against B2-1028 (trial-mix-moe-prefill-breakable-1028), adjacent brackets on one GPU, one change at a time:
#   memory fix (MemPool commit)  weights 82.36 -> 68.90 GB, full KV pool 596,736 -> 987,776 tokens;
#                                70000/300 c4 1.003, c16 1.045, median TTFT c16 28.4 -> 6.6 s; GSM8K 0.9613
#                                (prtest_h13/0001)
#   these [args] (unfixed weights)  1024/1024 c4 1.006, c64 1.015; 8192/1024 c16 1.037, c64 1.064;
#                                70000/300 c4 1.078, c16 1.107, median TTFT c16 28.4 -> 19.6 s; GSM8K 0.9598
#                                TP2: 1024/1024 c64 1.036, 8192/1024 c64 1.075, 70000/300 c16 1.092
#                                (srvargs_h13/0001)
#   EV unset                     +0.4..0.9 % at 5 of 6 TP1 points, TP2 8192/1024 +0.3..3.9 %; GSM8K 0.9621
#                                (ev_h13/0001)
# The memory fix and the [args] were each measured against B2-1028, not together: the pool of the whole recipe
# (MemPool + max-running-requests 128 + chunk 16384) is estimated at ~1.1M tokens at TP1, not measured.
# B2-1028 itself over best_known_1026 (A), same box: 1.37-1.50 at 1024/1024, 1.31-1.46 at 8192/1024, 1.16-1.21 at
# 70000/300 (mi45x-dpx-standard, 10-28; ww44 summary 094).
#
# Accuracy and the gfx1250 TDM-store race (10-29, lowc_h13/0001).  On gfx1250 a tensor_store_from_lds of an
# LDS-staged tile can read LDS before the waves' ds_stores are visible to it (no documented wait or fence closes it;
# only delay or an extra LDS round trip do), so the gluon kernels that end that way corrupted served rows silently:
#   - MoE decode (the switch's < 384-token path): TP2 after-load GSM8K failed 9 of 14 runs ('!!!!'), TP1 had the same
#     bad rows more rarely.  Fixed by 484470dfa (registers -> global stores): 12 of 12 TP2 and TP1 gates, in-graph pair
#     counters 0 over ~1M calls per rank; no cost against healthy runs (c4-c64 within 0.5 %).
#   - Unified attention 2D decode (sliding window, 64+ requests): TP1 472-535 and TP2 4-7 corrupted served rows per
#     run, invisible in GSM8K.  Fixed for gpt-oss shapes by a302ebe52: 0 in 3 of 3 serving runs, GSM8K 0.9583 / 0.9613
#     / 0.9568; kernel time fix / original 0.981-1.000 on gpt-oss decode shapes (no end-to-end bracket: the box was
#     power-capped that night).
#   - Unified attention 2D *extend* corrupted a few rows per run (0-27) with the TDM store; the register store raced
#     too, through a compiler bug (B4: LLVM dropped the barrier's LDS wait at a loop's top).  Fixed by the Triton
#     commit (B4) plus 628e82f8e (B1c): 0 differences offline, 0 corrupted served rows (10-30, h13-14; 10-31, e21-13).
# TP1 and TP2 pass every after-load gate with these trees.  B2's f19-14 failure (10-27) is most likely this race.
#
# Numbers on h13-14 move with what the box's other GPUs do (power-limited: a GPU's GFX clock falls to 0.9-1.3 GHz
# under load, and one GPU measured +7..13 % when the others went idle).  Quote only adjacent brackets.
#
# ---------------------------------------------------------------------------------------
# Why each line is here
#
#   SGLANG_GFX1250_W4A8_FLYDSL = "1"            the switch: one weight copy in FlyDSL's layout (gate/up
#       interleaved, 2880 -> 3072 padded); batches >= MIN_TOKENS run aiter.fused_moe FlyDSL a8w4 (MXFP8
#       activations), smaller ones gluon moe_gemm_a8w4 over moe_weight_decode_view of the same storage on
#       128-aligned dims (2944).
#   SGLANG_GFX1250_W4A8_FLYDSL_MIN_TOKENS = "384"   decode batches (<= 64) must stay on gluon, prefill buckets
#       (>= 832) on FlyDSL; the branch is fixed per graph bucket, and served traffic almost never falls between
#       128 and 1024, so 256-1024 serve the same.  Per-layer crossover ~450 tokens at TP1 (flat 320-768), ~1536
#       at TP2.  MIN 16 (the switch's old code default): -19 % at 1024/1024 c64 and 8192/1024 c16
#       (mintok_h13/0001).
#   SGLANG_GFX1250_W4A8_BACKEND = "triton", _KERNEL_GATHER = "0"   act only where FlyDSL is not used (expert
#       parallelism): with the switch off this is best_known_1026's MoE.
#   AITER_GFX1250_UA3D_NHD_CFG = '{"waves_per_eu":2}'   D3 (46d727fa7).
#   SGLANG_USE_AITER = "1"                      #44455's gate (the image exports it too; pinned here).
#   ENABLE_CK = "0"                             gpt-oss-120b/base's.
#   TRITON_HIP_USE_EXPERT_SCHEDULING            deliberately absent.  Unset is "1" on gfx1250 (triton-custom's
#       default: the LLVM amdgpu-expert-scheduling-mode, every Triton/Gluon kernel); every earlier profile's "0"
#       turned it off for no recorded reason.  Absent rather than "1", so a later Triton's default is followed.
#   attention-backend = "aiter", page-size = 64      aiter unified attention needs a real page; 64 is still the
#       peak (32: -22 % at 70000/300; 128: -10 % at 8192/1024 c64).
#   chunked-prefill-size = max-prefill-tokens = 16384   (was 3072, tuned for the old Triton MoE in ww41) the
#       main lever: over 3072, 8192/1024 +3.5/+4.9 %, 70000/300 +7.3/+9.0 % (4096 +0..2 %, 8192 +3..5 %);
#       1024/1024 flat.  Costs a larger prefill graph (7.79 GB vs 4.37) and ~27k pool tokens.  Set both.
#   max-running-requests = 128                  (was 512) with the radix cache off, SGLang sizes the SWA pool
#       for the request cap: (window + 128 + 2 x page) x cap + 2 x chunk + page tokens.  512 held 147k SWA
#       tokens no point up to c64 uses; 128 gives them to the full pool (+120k).  Every decode batch up to c64
#       is still graphed (decode graphs to bs 128).  Not for concurrency above 128.
#   enable-mixed-chunk = true                   decode rows ride in prefill batches: +2..3 % at 1024/1024 c64
#       and 8192/1024; costs median TTFT (1024/1024 c64 62 -> 70 ms, 8192/1024 c64 ~295 -> 365 ms alone).
#   cuda-graph-backend-prefill = "breakable"    prefill CUDA graphs: FlyDSL costs ~1 ms of CPU per eager call;
#       the graph's buckets follow the chunk size.
#   mem-fraction-static = 0.9                   unchanged.  With attention-backend aiter and context > 8192 SGLang
#       multiplies it by 0.85 (0.9 runs as 0.765; opt-out SGLANG_AITER_HONOR_EXPLICIT_MEM_FRACTION=1).  1.0
#       (0.85) gave the unfixed B2 +355k pool tokens and one retraction; not re-measured with the memory fix.
#   disable-radix-cache, trust-remote-code      the benchmark's random prompts share no prefix.
#
# Not set: AITER_TRITON_A8W4_BM16_NUM_STAGES, AITER_GFX1250_UA2D_RUNTIME_SEQ, SGLANG_GFX1250_LM_HEAD_TGEMM
# (best_known_1026's switches; no reader in these trees: #6999 and #44455 replace the last two).

description = "gpt-oss-120b W4A8 gfx1250 base1028: mix MoE (FlyDSL >= 384, gluon below), MemPool, gfx1250 TDM-store race fixes (MoE, attention decode and extend) + B4 Triton fix, chunk 16384, mixed chunk, EV default; base1028-20261030 trees (image -20261030); self-contained"
arch = ["gfx1250"]
model = "/model/gpt-oss-120b-w-mxfp4-a-fp8"
tp = 1

[env]
ENABLE_CK = "0"
SGLANG_USE_AITER = "1"
SGLANG_GFX1250_W4A8_BACKEND = "triton"
SGLANG_GFX1250_W4A8_KERNEL_GATHER = "0"
SGLANG_GFX1250_W4A8_FLYDSL = "1"
SGLANG_GFX1250_W4A8_FLYDSL_MIN_TOKENS = "384"
AITER_GFX1250_UA3D_NHD_CFG = '{"waves_per_eu":2}'

[args]
trust-remote-code = true
max-running-requests = 128
mem-fraction-static = 0.9
attention-backend = "aiter"
page-size = 64
chunked-prefill-size = 16384
max-prefill-tokens = 16384
enable-mixed-chunk = true
disable-radix-cache = true
cuda-graph-backend-prefill = "breakable"
