# gpt-oss-120b/gb300-trtllm for the small shape (32768/1024): the user's SWAR 0.4 (11-26), and GBS = the batch.
# The user's GBS is the point's batch: TP2 168, TP1 97.  The profile carries TP2's 168 (it also covers TP1's
# smaller batch); for TP1 exactly as measured, overlay it in the plan:
#   [server.args]
#   cuda-graph-max-bs-decode = 97

description = "gpt-oss-120b, GB300, recipe A for 32768/1024: swa-full-tokens-ratio 0.4, cuda-graph-max-bs-decode 168"
extends = "gpt-oss-120b/gb300-trtllm"

[args]
swa-full-tokens-ratio = 0.4
cuda-graph-max-bs-decode = 168
