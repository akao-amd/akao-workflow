# gpt-oss-120b/gb300-trtllm for the medium shape (131072/1024): the user's SWAR 0.2 (11-26), and GBS = the batch.
# The user's GBS is the point's batch: TP2 44, TP1 25.  The profile carries TP2's 44 (it also covers TP1's
# smaller batch); for TP1 exactly as measured, overlay it in the plan:
#   [server.args]
#   cuda-graph-max-bs-decode = 25

description = "gpt-oss-120b, GB300, recipe A for 131072/1024: swa-full-tokens-ratio 0.2, cuda-graph-max-bs-decode 44"
extends = "gpt-oss-120b/gb300-trtllm"

[args]
swa-full-tokens-ratio = 0.2
cuda-graph-max-bs-decode = 44
