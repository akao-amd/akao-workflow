# gpt-oss-120b/mi35x-nightly at TP2.  Created 2026-10-23 (ww43, console) for a TP1 / TP2 fixed-seq
# sweep on m12-33 (8x MI355X, gfx950).
#
# Same recipe as mi35x-nightly (inherited via extends: SGLang's MI35x nightly flags and env, the
# radix cache off, the openai MXFP4 checkpoint); only the tp pin changes, 1 -> 2.  mi35x-nightly
# pins tp = 1, so a plan giving it two GPUs is rejected; tp cannot be a plan override, hence this
# child profile.
#
# Upstream runs this recipe at TP8 with SGLang's default all-reduce, so unlike the gfx1250 TP2
# profiles (gpt-oss-120b/tp2, best-tp2, base1021-tp2) custom all-reduce is NOT disabled here: the
# DPX hang those profiles avoid was seen on gfx1250 partitions, not on MI355X.
#
# Untested at TP2 as of its creation.

description = "gpt-oss-120b MXFP4 (openai), MI355X at TP2: SGLang's MI35x nightly perf/accuracy recipe (upstream TP8)"
arch = ["gfx950"]
extends = "gpt-oss-120b/mi35x-nightly"
tp = 2
