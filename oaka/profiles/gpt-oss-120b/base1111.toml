# gpt-oss-120b/base1111 (TP1): the locked base after perf1101, from the 2026-11-07 h13-14 optimization round
# (/2026/ww45/1107_opt, README.md there: features Nov01-Nov13, measured A-B-A on their own GPU pairs).
# Extends gpt-oss-120b/perf1101 (read it, and base1028.toml for why each of its lines is there).  Only the
# differences are here:
#
#   kv-cache-dtype = fp8_e4m3, with SGLANG_6003_PREFILL_Q = static (prefill q fp8) and SGLANG_6003_DECODE_Q = bf16
#       Nov05, task 6003 arm B3.  Accuracy: RULER2 64k n=600 bf16 0.664 vs fp8 0.666 (paired +0.1 +- 1.5 pts),
#       GSM8K 0.958.  Speed, TP1 A-B-A on one partition: 70k/300 c4 1.114, 8k/1k c64 1.020 over perf1101-era A.
#       Longer context is NOT fine: RULER2 127k n=240, bf16 0.511 vs fp8 0.467 (paired -4.4 +- 2.2 pts; the
#       loss is mostly mv_niah_medium).  Do not serve fp8 KV above 64k without re-running the 127k gate.
#       The same two defaults are in SGLang's code (acac58ac); they are written here so the recipe says what runs.
#
# Trees.  A profile cannot carry a [stack.<pkg>]; the plan installs these, after
# `git -C /sgl-workspace/<tree> fetch https://github.com/akao-amd/<repo> base1111` (stack.sh never fetches).
# Branch base1111 of akao-amd/{triton,aiter,sglang}: draft-base1111 with each commit replaced by its upstream PR,
# on draft-base1111's bases (AITER main 07ff5f318, SGLang main c06e39c6ca, the image's Triton).  An open PR enters
# as one commit, its diff against its merge-base with main; a PR that merged main into its branch enters as its
# own (non-merge) commits instead.  Commits with no PR stay as they were.
#   Triton  [stack.triton]   commit 3c186fe6f1  the image's Triton (76940ad348 + revert of 9debefe441), then the
#           gfx1250 LDS-barrier fix (no PR; llvm/llvm-project#220357 fixes it in newer LLVM).  AITER's gpt-oss
#           extend register store needs it.
#   AITER   [stack.aiter]    commit 690aba898   image edits (no PR); #6999 (merged); #7743; #7202; #7203 (its
#           commits); #7289 (with #7288); #7746; #7155 (merged); #7745 (its commits, NS on top of #7203's G axis);
#           #7747; #7744; the gpt-oss extend register store (no PR, ported to #7203's USE_TDM_STORE flag).
#           Not in it: #7201 (V-tail masking; dropped on the tracker), Nov06 and its revert.
#   SGLang  [stack.sglang]   commit 160eaee014  image edits (no PR); #47398 (merged; the W4A8 FlyDSL/gluon MoE,
#           F6 gather+quant and TopK bypass); #49566; the profiler sync (no PR); #49567 (its commit); the 6003 fp8
#           q modes and their defaults (no PR).
#   Against draft-base1111 the PRs carry their review changes: #7202 buffer_store epilogue, #7203 USE_TDM_STORE
#   config flag, #7743 tuned UA3D split by default for plain D<=64 decode, #49566 gated to gfx1250 and matching
#   dtypes, #47398's review changes.
#
# Dropped 2026-11-08: Nov06 (AITER 14426941e, gluon UA2D fp8 q + fp8 KV prefill config DT_fp8_fp8.NS_LEQ_8:
#   BLOCK_M 256, NUM_BUFFERS 3, for <= 8 seqs).  It crashes the server.  _unified_attention_2d_gfx1250 falls back
#   to loop variant 0 when the longest query of a launch is short (next_pow2(max_seqlen_q * 8) < BLOCK_M, under 32
#   tokens) and keeps NUM_BUFFERS 3, which variant 0 rejects (static_assert NUM_BUFFERS == 2).  Hit at 70000/300 c8
#   on TP1 (1108_suite task 7010); the 11-07 runs measured 70k at c4 only.  33b7a581f reverts it on the branch, so
#   fp8 prefill with <= 8 seqs uses DT_fp8_fp8 (BLOCK_M 128, NUM_BUFFERS 2) again.  Its gain (+5.4 % at 70k/300 c4
#   on the TP1 stack) is not in this profile.  To bring it back, the wrapper must also set NUM_BUFFERS 2 when it
#   forces loop variant 0.
# Measured on these trees: mi45x-dpx-standard, /2026/ww46/suite_base1111/3100_base1111_suite (f19-17, 2026-11-11),
#   all 45 points complete, GSM8K 0.961-0.964.  TP1 1k/1k c64 7037, 8k/1k c64 4196, 70k/300 c4 158 output tok/s;
#   TP2 1k/1k c64 9491, 8k/1k c64 5689, 70k/300 c4 224.  Against draft-base1111 on the same box (0001): geomean 0.999
#   over 45 points (0.988-1.016); 70k/300 at TP1 and TP1x2 about -0.7 % (9 of 10 points below), not tracked.
#
# Not in this profile, on purpose: 6007 (RMSNorm-fused MoE pad, SGLANG_AITER_FUSE_RMSNORM_PAD) and 6964
# (one-launch routing top-k).  Both were in the measured TP1 stacks (+0.9 % and +0.5 % alone) and are not locked.
# Not measured end-to-end against perf1101: base1111 itself.  Its features were measured one by one, and the stacks the
# numbers came from also carried 6007/6964, so run an A-B-A of this profile against perf1101 before quoting a total.
#
# Kept as they are from perf1101: F6 (SGLANG_GFX1250_W4A8_FUSED_GATHER_QUANT, BYPASS_TOPK), F17 UA3D config,
# breakable prefill graph, mixed chunk, chunk 16384, page 64, max-running-requests 128, radix cache off.
# Nov02's tiled RoPE and Nov07's in-place output are on by default in the code; their off switches are
# SGLANG_FUSED_ROPE_KV_TILED=0 (Nov02) and none (Nov07).

description = "gpt-oss-120b base1111 (TP1): perf1101 + fp8_e4m3 KV (prefill q static, decode q bf16); base1111 trees (upstream PRs)"
arch = ["gfx1250"]
extends = "gpt-oss-120b/perf1101"

[env]
SGLANG_6003_PREFILL_Q = "static"
SGLANG_6003_DECODE_Q = "bf16"

[args]
kv-cache-dtype = "fp8_e4m3"
