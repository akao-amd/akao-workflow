# meta1124's decode traces on MI450 (user, 2026-11-26: "only decode trace, 20 of them; I don't mind prefill
# settings; remove flags that keep the torch profiler from capturing correctly"): meta1124-trace's points
# (20 DECODE steps per capture, no prefill capture) on one physical MI45x GPU in DPX mode, tp1 and tp2.
# tp1x2 is not traced: trace clients take no lockstep, so its servers would be traced one at a time, which
# is tp1 with an idle sibling.
#
# Layouts serve the recipe's trace variants: tp1 <recipe>-trace, tp2 <recipe>-tp2-trace (mixed chunk off;
# TP2 also without the prefill CUDA graph): gpt-oss-120b/base1111-trace and base1111-tp2-trace exist.
#
# Draft:  oaka draft --suite meta1124-mi450-trace --profile <model>/<recipe> --gpus 4,5 [--port N]

extends = "meta1124-trace"
description = "meta1124 decode traces on MI45x DPX: TP1 (one partition), TP2 (both); 20 decode steps, no prefill"
arch = ["gfx1250"]
partitions_of_one_gpu = true

[[layout]]
name = "tp1"
description = "one TP1 server on the first partition; the sibling idle"
servers = [[0]]
profile_suffix = "-trace"

[[layout]]
name = "tp2"
description = "one TP2 server across both partitions of one GPU"
servers = [[0, 1]]
profile_suffix = "-tp2-trace"
